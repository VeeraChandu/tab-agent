<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tab Agent</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="toolbar" class="toolbar">
    <div class="toolbar-actions">
      <button id="themeBtn" class="icon-btn" title="Theme">
        <svg id="themeIconDark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="themeIconLight" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg id="themeIconAuto" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <rect x="2" y="4" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </button>
      <button id="newChatBtn" class="icon-btn" title="New chat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="historyBtn" class="icon-btn" title="History" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <path d="M3 4v5h5"/>
          <path d="M12 7v5l3.5 3.5"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="topProgress" class="top-progress"><div class="bar"></div></div>

  <div id="warningBanner" class="banner hidden"></div>

  <div id="historyPanel" class="history-panel hidden">
    <div class="history-panel-header">
      <span>History</span>
      <button id="closeHistoryBtn" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <input id="historySearch" class="history-search" type="text" placeholder="Search chats…" />
    <div id="historyList" class="history-list"></div>
  </div>

  <main>
    <div id="emptyState" class="empty-state">
      <p>Tell Tab Agent what to do on this tab: summarize, fill a form, find something, or check across your open tabs.</p>
    </div>
    <div id="log" class="log" aria-live="polite" aria-atomic="false"></div>
  </main>

  <footer>
    <div id="footerResizeHandle" class="footer-resize-handle" title="Drag to resize"></div>
    <div id="agentPopover" class="agent-popover hidden"></div>
    <div id="editBanner" class="edit-banner hidden">
      <span>✎ Editing a previous message - sending will branch from here</span>
      <button id="editBannerCancel" type="button">Cancel</button>
    </div>
    <div id="attachmentsRow" class="attachments-row hidden"></div>

    <div class="composer">
      <div id="composerUsage" class="composer-usage hidden"></div>
      <div id="agentChip" class="agent-chip hidden">
        <span class="agent-chip-icon">🤖</span>
        <span id="agentChipName"></span>
        <button id="agentChipClear" type="button" class="agent-chip-clear" title="Remove agent">✕</button>
      </div>
      <textarea id="taskInput" rows="1" placeholder="Ask Tab Agent to do something on this page… (/ for commands, @ for agents)"></textarea>

      <div class="composer-toolbar">
        <div class="composer-left">
          <button id="attachBtn" class="icon-btn" title="Attach image, PDF, or text file">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button id="micBtn" class="icon-btn hidden" title="Voice input">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
              <path d="M19 11a7 7 0 0 1-14 0"/>
              <path d="M12 18v3"/>
            </svg>
          </button>
          <select id="modelSelect" class="model-select" title="Model"></select>
          <button id="stepThroughToggle" class="icon-btn step-through-toggle" title="Step-through mode: pause before each tool call">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
          </button>
        </div>
        <div class="composer-right">
          <span id="queueBadge" class="queue-badge hidden" title="Queued tasks"></span>
          <button id="stopBtn" class="icon-btn stop-btn hidden" title="Stop">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
          <button id="runBtn" class="icon-btn send-btn" title="Send (Enter)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*,application/pdf,.txt,.md,.markdown,.csv,.tsv,.json,.log,.yaml,.yml,.xml,.html,.htm,.js,.ts,.py,.css,.sh,.java,.c,.cpp,.go,.rb,.php,.rs,text/plain,text/csv,text/markdown,application/json" multiple hidden />
  </footer>

  <!-- Replay overlay — shown when the user clicks 📽 on a history row -->
  <div id="replayOverlay" class="replay-overlay hidden">
    <div class="replay-header">
      <span id="replayTitle">Recording</span>
      <button id="replayClose" class="icon-btn" title="Close replay">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="replay-body">
      <div id="replayStrip" class="replay-strip"></div>
      <div id="replayScreenshot" class="replay-screenshot"></div>
    </div>
  </div>

  <script src="lib/markdown.js"></script>
  <script src="lib/pricing.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
