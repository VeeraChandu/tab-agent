name: Release

# Code quality -> unit tests -> build, gated behind semantic-release: every
# push to main runs lint and tests first; only if both pass does the build
# job run `npx semantic-release`, which inspects Conventional Commits since
# the last tag, decides whether a release is warranted and what version it
# gets, builds the extension zip (via scripts/build.js, invoked through the
# @semantic-release/exec plugin — see .releaserc.json in this same directory), tags the commit,
# writes CHANGELOG.md, publishes a GitHub Release with the zip attached, and
# ONLY THEN publishes to the Chrome Web Store (a second @semantic-release/exec
# entry, deliberately placed after @semantic-release/github in the plugins
# list — see scripts/publishToChromeStore.js).
# If commits since the last release don't warrant one (e.g. only chore/docs
# commits), semantic-release no-ops instead of failing, and the back-merge
# step below still runs but is a no-op fast-forward (nothing new to merge).
#
# Ordering matters here: semantic-release pushes the version-bump commit and
# the git tag to main UNCONDITIONALLY, before any "publish"-step plugin runs
# at all, and the publish step is fail-fast (the first plugin to throw stops
# the rest from running - it does NOT run every plugin and collect errors).
# Putting the Chrome Web Store exec step last means a Chrome failure can
# never prevent the GitHub Release/zip asset from being created - only the
# Chrome step itself is at risk of failing.
#
# main only ever advances via promote-to-main.yml's fast-forward, so the only
# way main gets ahead of dev is the version/changelog commit semantic-release
# creates right here. The back-merge step folds that commit into dev so the
# two branches don't permanently diverge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality-test:
    name: Quality & tests
    uses: ./.github/workflows/quality-test.yml

  release:
    name: Build & semantic-release
    needs: quality-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/build.js runs as semantic-release's "prepare" step (see
      # .releaserc.json in this same directory) once a release is confirmed,
      # so a plain `npm run build` here isn't needed — semantic-release owns
      # the whole analyze -> build -> tag -> publish -> Chrome Web Store
      # sequence from this point. --extends is required since the config
      # doesn't live at the repo root where semantic-release would otherwise
      # auto-discover it; the path is spelled out from the repo root because
      # `run:` steps execute with cwd = the repo root, not this file's own
      # directory.
      # GITHUB_TOKEN here is MAIN_PUSH_TOKEN, not the default secrets.GITHUB_TOKEN —
      # @semantic-release/git pushes the version-bump commit and tag straight to
      # main using this same env var, and main's ruleset only lists the repo-Admin
      # role as a bypass actor (see promote-to-main.yml's own comment on this same
      # constraint). The default Actions bot identity isn't an Admin, so that push
      # was rejected (GH013 rule violation) until this used the same bypass-capable
      # token promote-to-main.yml already relies on for its own push to main.
      - run: npx semantic-release --extends ./.github/workflows/.releaserc.json
        env:
          GITHUB_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      - name: Back-merge main into dev
        # Runs even if the semantic-release step above failed (e.g. Chrome Web
        # Store publish rejected) or partially succeeded, since the tag and
        # version-bump commit are USUALLY pushed to main unconditionally before
        # any publish-step plugin runs - by the time this step is reached
        # there's almost always something on main worth folding back into dev.
        # Only skipped if the job was cancelled outright.
        if: ${{ !cancelled() }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The one case the "usually" above doesn't cover: @semantic-release/git's
          # own push to main can itself fail (e.g. a ruleset rejection) - when that
          # happens, HEAD here is a version-bump commit that only ever existed in
          # this runner's local checkout, never actually landed on origin/main.
          # Back-merging it to dev would leak a commit that looks like a real
          # release (a real "chore(release): x.y.z" message, real changelog text)
          # but has no tag, no GitHub Release, and no Chrome Store publish behind
          # it anywhere - confirm HEAD actually matches origin/main first.
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin main | cut -f1)" ]; then
            echo "HEAD was never actually pushed to origin/main (semantic-release's own push likely failed) - nothing real to back-merge, skipping."
            exit 0
          fi
          git fetch origin dev
          if git push origin HEAD:dev; then
            echo "Fast-forwarded dev to main."
          else
            echo "dev has diverged since the last promotion; creating a merge commit instead."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B dev origin/dev
            git merge --no-edit origin/main -m "chore: back-merge main into dev [skip ci]"
            git push origin dev
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
