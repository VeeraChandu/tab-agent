name: CI

# Quality gate for pull requests and pushes to any branch other than main —
# same lint/test steps the release workflow runs, without building or
# releasing anything. Keeps feedback fast on branches/PRs before merge.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  quality:
    name: Code quality (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
